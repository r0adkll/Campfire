name: TODO <> Issues

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: alstr/todo-to-issue-action@v5
        with:
          # Vendored upstream code: its TODOs belong to the upstream projects, not our backlog.
          IGNORE: "^features/reader/ui/src/commonMain/composeResources/files/reader/(foliate|epubjs-cfi)/,^thirdparty/"
