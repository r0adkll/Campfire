name: Alpha Release

on:
  push:
    branches:
      - main

  pull_request:
    paths:
      - '.github/workflows/alpha-release.yml'

  # Re-runs a push build GitHub never started (dropped push events can't be re-run)
  workflow_dispatch:

jobs:
  android-release:
    name: Build Android Release
    # Skip on fork PRs — this workflow needs first-party secrets (Drop keystore, Firebase, Mixpanel).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The Drop upload authenticates with the workflow's OIDC token
      id-token: write

    steps:
      - name: Setup swap
        run: |
          sudo swapon --show
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon -s

      - name: Free up disk space
        run: |
          sudo apt purge -yq $(dpkg -l | grep '^ii' | awk '{ print $2 }' | grep -P '(aspnetcore|cabal-|dotnet-|ghc-|libmono|mongodb-|mysql-|php)') \
            firefox google-chrome-stable google-cloud-cli microsoft-edge-stable mono-devel mono-runtime-common monodoc-manual powershell ruby
          sudo apt autoremove -yq
          sudo apt clean
          sudo rm -fr /opt/ghc /opt/hostedtoolcache /opt/az /opt/microsoft /opt/google /usr/lib/node_modules /usr/local/share/boost /usr/share/dotnet /usr/share/swift

      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Every Drop-distributed alpha (pull requests and main) is signed with the internal Drop key,
      # so testers move between them without reinstalling.
      - name: Decode Drop Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.CAMPFIRE_DROP_KEYSTORE }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 -di > app/signing/drop.keystore
          else
            echo "Skipping the Drop keystore (no secret available); the APK is debug-signed"
          fi

      # Minutes since 2020-01-01 UTC: shared by every alpha workflow, so the main build after a merge
      # always outranks the pull request's build and installs over it.
      - name: Generate build number
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_CAMPFIRE_VERSIONCODE=$(( ($(date +%s) - 1577836800) / 60 ))" >> $GITHUB_ENV

      - name: Download Service Accounts
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          APP_DISTRIBUTION_JSON: ${{ secrets.APP_DISTRIBUTION_SERVICE_ACCOUNT }}
        run: |
          echo $GOOGLE_SERVICES_JSON > app/android/google-services.json
          echo $APP_DISTRIBUTION_JSON > app/android/campfire-app-distribution-service-account.json

      - name: Assemble Alpha Release APK
        run: ./gradlew :app:android:assembleAlphaRelease
        env:
          ORG_GRADLE_PROJECT_CAMPFIRE_DROP_KEYSTORE_PWD: ${{ secrets.CAMPFIRE_DROP_KEYSTORE_PWD }}
          ORG_GRADLE_PROJECT_mixpanel_token: ${{ secrets.MIXPANEL_TOKEN }}
          CI: true

      # Alphas are 1:1 with squash-merged PRs, so the notes are the commit subject plus a
      # link back to the PR (the subject carries the "(#123)" suffix GitHub adds on squash).
      - name: Create Release Notes
        run: |
          subject="$(git log -1 --format='%s')"
          echo "$subject" > app/android/release-notes.txt
          if [[ "$subject" =~ \(#([0-9]+)\)$ ]]; then
            echo "${{ github.server_url }}/${{ github.repository }}/pull/${BASH_REMATCH[1]}" >> app/android/release-notes.txt
          fi
          echo " "
          cat app/android/release-notes.txt

      - name: Firebase App Distribution
        run: |
          ./gradlew :app:android:appDistributionUploadAlphaRelease \
            --serviceCredentialsFile="app/android/campfire-app-distribution-service-account.json" \
            --releaseNotesFile="app/android/release-notes.txt"

      # Uploads to the `main` Channel. Main only (pushes and manual runs): PRs editing this workflow
      # upload from build.yml.
      - name: Upload APK to Drop
        if: github.ref == 'refs/heads/main'
        uses: r0adkll/drop/action@v0
        with:
          server: https://drop.thescavengers.software
          apk: app/android/build/outputs/apk/alpha/release/android-alpha-release.apk

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-outputs
          path: app/android/build/outputs
