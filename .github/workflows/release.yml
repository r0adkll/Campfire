name: Release

on:
  release:
    types: [ created ]

jobs:
  android-beta:
    name: Build Android Beta Release
    runs-on: ubuntu-latest

    steps:
      - name: Setup swap
        run: |
          sudo swapon --show
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon -s

      - name: Free up disk space
        run: |
          sudo apt purge -yq $(dpkg -l | grep '^ii' | awk '{ print $2 }' | grep -P '(aspnetcore|cabal-|dotnet-|ghc-|libmono|mongodb-|mysql-|php)') \
            firefox google-chrome-stable google-cloud-cli microsoft-edge-stable mono-devel mono-runtime-common monodoc-manual powershell ruby
          sudo apt autoremove -yq
          sudo apt clean
          sudo rm -fr /opt/ghc /opt/hostedtoolcache /opt/az /opt/microsoft /opt/google /usr/lib/node_modules /usr/local/share/boost /usr/share/dotnet /usr/share/swift

      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.CAMPFIRE_KEYSTORE }}
        run: |
          echo $ENCODED_KEYSTORE | base64 -di > app/signing/campfire.keystore

      - name: Download Service Accounts
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          APP_DISTRIBUTION_JSON: ${{ secrets.APP_DISTRIBUTION_SERVICE_ACCOUNT }}
        run: |
          echo $GOOGLE_SERVICES_JSON > app/android/google-services.json
          echo $APP_DISTRIBUTION_JSON > app/android/campfire-app-distribution-service-account.json

      - name: Assemble Beta Release APK
        run: ./gradlew :app:android:assembleBetaRelease
        env:
          ORG_GRADLE_PROJECT_CAMPFIRE_KEYSTORE_PWD: ${{ secrets.CAMPFIRE_KEYSTORE_PWD }}
          ORG_GRADLE_PROJECT_CAMPFIRE_KEY_PWD: ${{ secrets.CAMPFIRE_KEY_PWD }}
          ORG_GRADLE_PROJECT_mixpanel_token: ${{ secrets.MIXPANEL_TOKEN }}
          ORG_GRADLE_PROJECT_CAMPFIRE_VERSIONNAME: ${{ github.event.release.tag_name }}
          CI: true

      - name: Create Release Notes
        run: |
          ./campfire changelog > app/android/release-notes.txt
          echo " "
          cat app/android/release-notes.txt

      - name: Firebase App Distribution
        run: |
          ./gradlew :app:android:appDistributionUploadBetaRelease \
            --serviceCredentialsFile="app/android/campfire-app-distribution-service-account.json" \
            --releaseNotesFile="app/android/release-notes.txt"

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-beta-build-outputs
          path: app/android/build/outputs

      - name: Get release information
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload APK to release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: app/android/build/outputs/apk/beta/release/android-beta-release.apk
          asset_name: campfire-beta-release.apk
          asset_content_type: application/vnd.android.package-archive

  android-play:
    name: Build Android Play Release Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Setup swap
        run: |
          sudo swapon --show
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon -s

      - name: Free up disk space
        run: |
          sudo apt purge -yq $(dpkg -l | grep '^ii' | awk '{ print $2 }' | grep -P '(aspnetcore|cabal-|dotnet-|ghc-|libmono|mongodb-|mysql-|php)') \
            firefox google-chrome-stable google-cloud-cli microsoft-edge-stable mono-devel mono-runtime-common monodoc-manual powershell ruby
          sudo apt autoremove -yq
          sudo apt clean
          sudo rm -fr /opt/ghc /opt/hostedtoolcache /opt/az /opt/microsoft /opt/google /usr/lib/node_modules /usr/local/share/boost /usr/share/dotnet /usr/share/swift

      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.CAMPFIRE_KEYSTORE }}
        run: |
          echo $ENCODED_KEYSTORE | base64 -di > app/signing/campfire.keystore

      - name: Download Service Accounts
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo $GOOGLE_SERVICES_JSON > app/android/google-services.json

      # The AAB is signed with the release keystore as the Play App Signing *upload* key;
      # Play re-signs it with the app signing key for distribution. Attached to the GitHub
      # release for upload to the Play Console.
      - name: Bundle Standard Release AAB
        run: ./gradlew :app:android:bundleStandardRelease
        env:
          ORG_GRADLE_PROJECT_CAMPFIRE_KEYSTORE_PWD: ${{ secrets.CAMPFIRE_KEYSTORE_PWD }}
          ORG_GRADLE_PROJECT_CAMPFIRE_KEY_PWD: ${{ secrets.CAMPFIRE_KEY_PWD }}
          ORG_GRADLE_PROJECT_mixpanel_token: ${{ secrets.MIXPANEL_TOKEN }}
          ORG_GRADLE_PROJECT_CAMPFIRE_VERSIONNAME: ${{ github.event.release.tag_name }}
          CI: true

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-play-build-outputs
          path: app/android/build/outputs

      - name: Get release information
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload AAB to release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: app/android/build/outputs/bundle/standardRelease/android-standard-release.aab
          asset_name: campfire-play-release.aab
          asset_content_type: application/octet-stream

  android-foss:
    name: Build Android FOSS Release
    runs-on: ubuntu-latest

    steps:
      - name: Setup swap
        run: |
          sudo swapon --show
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon -s

      - name: Free up disk space
        run: |
          sudo apt purge -yq $(dpkg -l | grep '^ii' | awk '{ print $2 }' | grep -P '(aspnetcore|cabal-|dotnet-|ghc-|libmono|mongodb-|mysql-|php)') \
            firefox google-chrome-stable google-cloud-cli microsoft-edge-stable mono-devel mono-runtime-common monodoc-manual powershell ruby
          sudo apt autoremove -yq
          sudo apt clean
          sudo rm -fr /opt/ghc /opt/hostedtoolcache /opt/az /opt/microsoft /opt/google /usr/lib/node_modules /usr/local/share/boost /usr/share/dotnet /usr/share/swift

      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.CAMPFIRE_KEYSTORE }}
        run: |
          echo $ENCODED_KEYSTORE | base64 -di > app/signing/campfire.keystore

      # google-services.json is intentionally never written in this job: the Firebase
      # gradle plugins stay disabled and no Firebase project config leaks into the FOSS
      # APK. The versionCode is derived from the release tag so the build is reproducible
      # from the tag alone.
      - name: Assemble Foss Release APK
        run: ./gradlew :app:android:assembleFossRelease
        env:
          ORG_GRADLE_PROJECT_CAMPFIRE_KEYSTORE_PWD: ${{ secrets.CAMPFIRE_KEYSTORE_PWD }}
          ORG_GRADLE_PROJECT_CAMPFIRE_KEY_PWD: ${{ secrets.CAMPFIRE_KEY_PWD }}
          ORG_GRADLE_PROJECT_CAMPFIRE_VERSIONNAME: ${{ github.event.release.tag_name }}
          CI: true

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-foss-build-outputs
          path: app/android/build/outputs

      - name: Get release information
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Stable asset name consumed by IzzyOnDroid's daily update checker and F-Droid's
      # reproducible-builds Binaries: URL.
      - name: Upload Foss APK to release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: app/android/build/outputs/apk/foss/release/android-foss-release.apk
          asset_name: campfire-foss-release.apk
          asset_content_type: application/vnd.android.package-archive

  # Uploads the AAB built above to Google Play. Separate from the build so a failed upload can
  # be re-run without rebuilding, and so the Play credentials never enter the build job. No-ops
  # until PLAY_SERVICE_ACCOUNT_JSON exists. Pre-releases (rc tags) go to open testing; final
  # releases start a 20% staged production rollout — widen it with the Play Rollout workflow.
  android-play-upload:
    name: Upload AAB to Google Play
    needs: [ android-play ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check for Play credentials
        id: creds
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping Google Play upload"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.creds.outputs.present == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/download-artifact@v7
        if: steps.creds.outputs.present == 'true'
        with:
          name: android-play-build-outputs
          path: app/android/build/outputs

      - name: Upload to Google Play
        if: steps.creds.outputs.present == 'true'
        run: |
          bundle exec fastlane android "$LANE" \
            aab:app/android/build/outputs/bundle/standardRelease/android-standard-release.aab \
            mapping:app/android/build/outputs/mapping/standardRelease/mapping.txt
        env:
          LANE: ${{ github.event.release.prerelease && 'beta' || 'production' }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  bump-version:
    name: Bump campfire.version
    needs: [ android-beta, android-play, android-foss ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Admin PAT so the commit can land on the protected main branch (see baseline-prof.yml).
          token: ${{ secrets.CAMPFIRE_BOT_PAT }}

      # `campfire.version` is always the version being prepared for release (scripts/release
      # reads it), so once a release ships move it to the next version: 1.0.2 -> 1.0.3,
      # 1.1.0-rc2 -> 1.1.0-rc3. Skipped if someone already moved it past the released tag.
      # [skip ci] keeps the bump commit from producing a throwaway alpha build.
      - name: Compute next version
        id: next
        env:
          RELEASED: ${{ github.event.release.tag_name }}
        run: |
          released="${RELEASED#v}"
          current="$(sed -n 's/^campfire\.version=//p' gradle.properties)"
          if [ "$current" != "$released" ]; then
            echo "campfire.version is already $current (released $released); nothing to bump"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$released" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}-rc$((BASH_REMATCH[2] + 1))"
          elif [[ "$released" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            echo "::error::unrecognised release tag '$released'"
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"

      # Pushes straight to main when the PAT's user can bypass the branch ruleset; otherwise
      # opens a PR and lets auto-merge land it once the required checks pass.
      - name: Commit and push
        if: steps.next.outputs.skip != 'true'
        env:
          NEXT: ${{ steps.next.outputs.next }}
          GH_TOKEN: ${{ secrets.CAMPFIRE_BOT_PAT }}
        run: |
          sed -i "s/^campfire\.version=.*/campfire.version=$NEXT/" gradle.properties
          git config user.name "Rotom-Bot"
          git config user.email "38791843+Rotom-Bot@users.noreply.github.com"
          git commit -am "Bump campfire.version to $NEXT [skip ci]"
          if git push origin main; then
            exit 0
          fi
          echo "::warning::direct push to main was rejected by the branch ruleset; opening a PR instead"
          branch="bump-version-$NEXT"
          git checkout -b "$branch"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump campfire.version to $NEXT" \
            --body "Automated bump after releasing ${{ github.event.release.tag_name }}. Auto-merges when checks pass."
          gh pr merge "$branch" --auto --squash
