name: Bug Report
description: Report something in Campfire that isn't working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below so we can reproduce and fix the issue quickly.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      description: Before submitting, please confirm the following.
      options:
        - label: I searched [existing issues](https://github.com/r0adkll/Campfire/issues) and did not find a duplicate.
          required: true
        - label: I am running the latest version of Campfire available on my platform.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: When I tap play on a downloaded book, the app...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the bug.
      placeholder: |
        1. Open the app
        2. Navigate to '...'
        3. Tap '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages if any.
    validations:
      required: true

#  - type: dropdown
#    id: platform
#    attributes:
#      label: Platform
#      description: Which Campfire client are you using?
#      options:
#        - Android
