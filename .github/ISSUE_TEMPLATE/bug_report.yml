#      options:
#        - Not applicable
#        - Alpha
#        - Beta
#        - Release
#    validations:
#      required: false

  - type: input
    id: app-version
    attributes:
      label: Campfire version
      description: Find this in Settings → About.
      placeholder: e.g. 1.2.3-alpha
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Audiobookshelf server version
      description: Find this in your Audiobookshelf server's Settings → About.
      placeholder: e.g. 2.17.5
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / OS
      description: Device model and OS version.
      placeholder: e.g. Pixel 8 Pro (Android 15), iPhone 15 (iOS 18.2), MacBook Pro M2 (macOS 14.5)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or screen recordings
      description: |
        Drag and drop any relevant logs, screenshots, or recordings. On Android, you can shake the device to report a bug with logs attached.
      placeholder: Paste logs in a code block or attach files.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might help — library size, server setup quirks, reverse proxy, etc.
    validations:
      required: false
