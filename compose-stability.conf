// Classes the Compose compiler should treat as stable even though their modules aren't compiled
// with it. Stable parameters compare with equals() instead of identity, so a model that was
// re-queried or re-mapped but is unchanged no longer re-runs every composable that takes it.
//
// Only list types that are truly immutable: every property a val, every collection read-only and
// never mutated after construction. A mutable type listed here makes the UI skip real changes.

// Domain models (all data classes of vals and read-only collections)
app.campfire.core.model.**

// Player-facing models (Metadata, RunningTimer, EqualizerState, PlaybackTimer, …)
app.campfire.audioplayer.model.**

// Dates and times
kotlinx.datetime.*
