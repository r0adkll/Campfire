//
// Packaging for the desktop app. See docs/desktop-release.md for the signing keys and
// notarization credentials this expects, and how to produce them.
//
//   conveyor make site        # every machine, into output/
//   conveyor make mac-app     # just this machine's, for a quick check
//
// Conveyor is free for OSI-licensed projects; app.vcs-url below is what claims that.

// Classpath, JDK, version, main class and the per-machine skiko + FFmpeg natives all come from
// Gradle, so there is exactly one place dependencies are declared. See :app:desktop's
// machineDependencies() for how each machine's natives are kept apart.
include "#!./gradlew -q --no-scan :app:desktop:printConveyorConfig"

// Moves native libraries out of their JARs into the JVM lib folder, where Conveyor signs them and
// deletes the ones for other platforms. Two reasons, and the first is not optional:
//
//   1. In-JAR signing matches .so/.dll/.dylib, and JNA ships its macOS native as a .jnilib, which
//      goes unsigned — Apple then refuses to notarize the whole app over that one file.
//   2. It is the largest size win available here. sqlite-jdbc alone carries 25.7 MB of natives for
//      platforms no single package can load, Android and FreeBSD among them.
include required("conveyor/extract-native-libraries.conf")

app {
  display-name = Campfire
  fsname = campfire
  rdns-name = app.campfire
  license = GPL-3.0-only

  // Otherwise the Debian package lists its maintainer as <nobody@nowhere>.
  contact-email = "drew@thescavengers.software"

  // Also derives app.site.base-url, the releases/latest/download URL updates are fetched from.
  // CI uploads the site to the release itself; see docs/desktop-release.md for why not copied-site.
  vcs-url = "github.com/r0adkll/Campfire"

  // Full-bleed square for Windows and Linux, which want the artwork edge to edge; Conveyor
  // rasterises every size it needs from it and rounds the corners on Linux itself.
  icons = "app/desktop/src/main/resources/icon.png"

  // macOS gets its own, because Conveyor rounds corners but does not inset, and a macOS icon that
  // fills its canvas reads as noticeably larger than everything beside it in the Dock. This one is
  // already in Apple's silhouette — see tools/desktop-icon/generate.sh — and is the same file the
  // running app hands to Taskbar.
  mac.icons = "app/desktop/src/main/resources/icon-macos.png"

  // Matches the machine configurations :app:desktop declares natives for. Adding a machine here
  // without adding it there would ship a package with no skiko and no audio engine.
  machines = [ mac.aarch64, mac.amd64, windows.amd64, linux.amd64.glibc ]

  // Deliberately NOT pointed at the ProGuard output. Jars handed to Conveyor through a
  // hand-written app.inputs entry bypass its native-library handling: they are neither signed nor
  // pruned, which left JNA's libjnidispatch.jnilib carrying only the linker's ad-hoc signature
  // (Apple refuses to notarize over exactly that) and left sqlite-jdbc's 25.7 MB of natives for
  // other platforms sitting in the package. Enumerating the shrunk jars individually instead
  // overflows Conveyor's 16 KB argument buffer, all 264 of them. So the classpath comes from the
  // Gradle plugin above, and the size win comes from extract-native-libraries rather than
  // ProGuard. See docs/desktop-release.md.

  // jlink keeps only what jdeps finds referenced in bytecode, which misses everything reached
  // reflectively. Kept in step with nativeDistributions.modules in :app:desktop — see the note
  // there for where each of these comes from.
  jvm.modules += java.instrument
  jvm.modules += java.management
  jvm.modules += java.net.http
  jvm.modules += java.prefs
  jvm.modules += java.sql
  jvm.modules += jdk.crypto.ec
  jvm.modules += jdk.unsupported

  mac {
    certificate = "app/signing/apple.cer"

    // The bytedeco FFmpeg natives that carry the audio engine are built against the macOS 15 SDK
    // and declare minos 15.0 in their MachO headers, so they will not dlopen on anything older;
    // everything else here goes back to macOS 11. Claiming 11 would mean an app that launches
    // fine on macOS 14 and then cannot play a single file, so the floor follows the binaries.
    // Conveyor scans the headers and fails the build if this drifts out of step with them.
    info-plist.LSMinimumSystemVersion = 15.0

    // Optional substitutions, so this block adds nothing on a machine where the variables are
    // unset: locally these three come from the Hydraulic defaults.conf that `conveyor keys
    // generate` wrote, and an unset optional substitution leaves the key undefined rather than
    // overriding it with empty. CI has no defaults.conf — it is gitignored, being secret — so
    // there the values arrive as environment variables instead.
    //
    // Apple ID + app-specific password rather than an App Store Connect API key, matching what
    // `conveyor keys generate` sets up.
    notarization {
      team-id = ${?env.APPLE_TEAM_ID}
      apple-id = ${?env.APPLE_ID}
      app-specific-password = ${?env.APPLE_APP_SPECIFIC_PASSWORD}
    }
  }
}

conveyor.compatibility-level = 23
