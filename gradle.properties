## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Fri Nov 08 19:19:45 EST 2024
org.gradle.jvmargs=-Xmx11264M -Dfile.encoding\=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx11264M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

org.jetbrains.compose.experimental.uikit.enabled=true

# The version currently being prepared for release. Read by scripts/release and bumped
# automatically by the Release workflow once a release ships.
campfire.version=1.0.3
# The versionCode for campfire.version, kept in lockstep with it (MMmmppRR). scripts/release
# and CI both assert `campfire.versionCode == deriveVersionCode(campfire.version)`. The build
# reads this directly so a `git checkout <tag> && ./gradlew assembleFossRelease` reproduces the
# exact shipped code with no build args; F-Droid's UpdateCheckData reads it from the tag too.
campfire.versionCode=1000399

# Local-only convenience repos. Keep disabled by default so builds are reproducible from
# public release repositories alone (a hard requirement for F-Droid); enable in
# ~/.gradle/gradle.properties or via -P when developing against local or snapshot
# artifacts.
campfire.config.enableMavenLocal=false
campfire.config.enableSnapshots=false

kotlin.code.style=official
kotlin.incremental.native=false
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

ksp.incremental.log=true



# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
